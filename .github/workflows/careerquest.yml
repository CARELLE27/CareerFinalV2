name: CareerQuest CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:

  backend:
    name: Backend Django
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python manage.py check
        env:
          SECRET_KEY: 'ci-test-key'
          DEBUG: 'True'
          DATABASE_URL: 'sqlite:///test.db'
          ALLOWED_HOSTS: 'localhost'

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          # ✅ PAS de cache du tout
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
        env:
          CI: false

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t careerquest-backend ./backend
      - run: docker build -t careerquest-frontend ./frontend
