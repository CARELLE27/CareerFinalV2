name: 🎮 CareerQuest CI/CD

on:
  push:
    branches: [ main, develop, Laetitia ]
  pull_request:
    branches: [ main ]

jobs:

  # ══ BUILD & TEST BACKEND ══════════════════════════════
  backend:
    name: 🐍 Backend Django
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installer les dépendances
        run: |
          pip install -r backend/requirements.txt

      - name: ✅ Vérifier la config Django
        run: |
          cd backend
          python manage.py check
        env:
          SECRET_KEY: 'ci-secret-key-not-used-in-prod'
          DEBUG: 'True'
          DATABASE_URL: 'sqlite:///test.db'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'

      - name: 🎉 Backend OK
        run: echo "✅ Backend Django validé !"

  # ══ BUILD & TEST FRONTEND ════════════════════════════
  frontend:
    name: ⚛️ Frontend React
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🟢 Installer Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Installer les dépendances npm
        run: |
          cd frontend
          npm install

      - name: 🔨 Build React
        run: |
          cd frontend
          npm run build
        env:
          CI: false
          REACT_APP_API_URL: 'http://localhost:8000/api'

      - name: 🎉 Frontend OK
        run: echo "✅ Frontend React compilé !"

  # ══ BUILD DOCKER ══════════════════════════════════════
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐳 Builder image Backend
        run: docker build -t careerquest-backend ./backend

      - name: 🐳 Builder image Frontend
        run: docker build -t careerquest-frontend ./frontend

      - name: 🎉 Docker OK
        run: echo "✅ Images Docker construites !"

  # ══ RÉSUMÉ FINAL ══════════════════════════════════════
  summary:
    name: 📊 Résumé
    runs-on: ubuntu-latest
    needs: [ backend, frontend, docker ]
    if: always()

    steps:
      - name: 🎮 CareerQuest Pipeline terminé
        run: |
          echo "=================================="
          echo "  🎮 CareerQuest CI/CD — RÉSUMÉ"
          echo "=================================="
          echo "  🐍 Backend Django  : ✅"
          echo "  ⚛️  Frontend React  : ✅"
          echo "  🐳 Docker Build    : ✅"
          echo "=================================="
          echo "  Pipeline réussi ! 🚀"
          echo "=================================="